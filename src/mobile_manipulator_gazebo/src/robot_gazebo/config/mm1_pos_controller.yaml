robot1/gazebo_ros_control:
  pid_gains:
    robot1_front_right_wheel_joint:
      p: 5.0
      i: 0.01
      d: 0.0
    robot1_front_left_wheel_joint:
      p: 5.0
      i: 0.01
      d: 0.0
    robot1_rear_right_wheel_joint:
      p: 5.0
      i: 0.01
      d: 0.0
    robot1_rear_left_wheel_joint:
      p: 5.0
      i: 0.01
      d: 0.0

